<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GPU VRAM Bandwidth</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{width:1px;height:1px}</style></head>
<body><canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false});
if(!gl){window.chrome.webview.postMessage(JSON.stringify({error:'WebGL2 not supported'}));return;}

const SIZE_MB=window.VRAM_SIZE_MB||128;
const N=SIZE_MB*1024*1024/4;

const cs=`#version 310 es
layout(local_size_x=256)in;
layout(std430,binding=0)buffer Src{float src[];};
layout(std430,binding=1)buffer Dst{float dst[];};
uniform int uN;
void main(){
uint idx=gl_GlobalInvocationID.x;
if(idx>=uint(uN))return;
dst[idx]=src[idx];
}`;

function compileShader(src,type){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}return s;}
const prog=gl.createProgram();
gl.attachShader(prog,compileShader(cs,gl.COMPUTE_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.uniform1i(gl.getUniformLocation(prog,'uN'),N);

const srcData=new Float32Array(N);for(let i=0;i<N;i++)srcData[i]=Math.random();
const srcBuf=gl.createBuffer();gl.bindBuffer(gl.SHADER_STORAGE_BUFFER,srcBuf);gl.bufferData(gl.SHADER_STORAGE_BUFFER,N*4,srcData,gl.STATIC_DRAW);
const dstBuf=gl.createBuffer();gl.bindBuffer(gl.SHADER_STORAGE_BUFFER,dstBuf);gl.bufferData(gl.SHADER_STORAGE_BUFFER,N*4,null,gl.DYNAMIC_DRAW);

const DURATION=window.BENCH_DURATION||6;
const startT=performance.now();
let rounds=0;

function run(){
const now=performance.now();
if((now-startT)/1000>=DURATION){
const elapsed=(now-startT)/1000;
const totalGB=rounds*SIZE_MB*2/1024;
const gbps=totalGB/elapsed;
window.chrome.webview.postMessage(JSON.stringify({type:'result',gbps:gbps}));
return;
}
gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER,0,srcBuf);
gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER,1,dstBuf);
gl.dispatchCompute(Math.ceil(N/256),1,1);
gl.memoryBarrier(gl.SHADER_STORAGE_BARRIER_BIT);
rounds++;
if(rounds%20===0){
const elapsed=(now-startT)/1000;
const totalGB=rounds*SIZE_MB*2/1024;
const gbps=totalGB/elapsed;
window.chrome.webview.postMessage(JSON.stringify({type:'progress',gbps:gbps}));
}
requestAnimationFrame(run);
}
requestAnimationFrame(run);
})();
</script></body></html>
